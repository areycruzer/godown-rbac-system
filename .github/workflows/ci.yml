name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: godown
          POSTGRES_PASSWORD: godown
          POSTGRES_DB: godown
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U godown"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      DATABASE_URL: postgres://godown:godown@localhost:5432/godown
      # Required by settings at import time; the test settings swap in
      # in-memory cache and channel layers, so no Redis server is needed.
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
